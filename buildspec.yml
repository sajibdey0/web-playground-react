version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 23
    commands:
      - echo "Installing dependencies..."
      - npm ci
  build:
    commands:
      - echo "Building the React app..."
      - npm run build
  post_build:
    commands:
      - echo "Syncing build to S3..."
      # Remove old files (optional) and sync new build
      - aws s3 sync dist/ s3://$S3_BUCKET/ --delete
      - echo "Setting s3 object ACLs (if needed)..."
      # For private bucket + CloudFront OAC you don't want public ACLs; skip ACL change.
      - echo "Invalidating CloudFront cache..."
      - >
        aws cloudfront create-invalidation
          --distribution-id $CLOUDFRONT_DIST_ID
          --paths "/*"
artifacts:
  files:
    - "**/*"
  base-directory: dist
